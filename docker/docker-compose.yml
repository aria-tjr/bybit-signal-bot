version: '3.9'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: crypto-signal-bot
    restart: unless-stopped
    environment:
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET}
      - BYBIT_TESTNET=${BYBIT_TESTNET:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/crypto_signals
      - TZ=UTC
      # Enhanced Bot Configuration
      - APP_VERSION=2.0.0
      - SCANNER_ENABLED=${SCANNER_ENABLED:-false}
      - DEFAULT_THRESHOLD_PCT=${DEFAULT_THRESHOLD_PCT:-3.0}
      - MAX_LEVERAGE=${MAX_LEVERAGE:-20}
      - MIN_LEVERAGE=${MIN_LEVERAGE:-10}
      - SCANNER_INTERVAL_MINUTES=5
      - MIN_PRICE_CHANGE_PCT=3.0
      - TOP_MOVERS_COUNT=20
      - MIN_VOLUME_USDT=1000000
      - TIME_FRAMES=["1m", "5m"]
      - LATENCY_THRESHOLD_MS=500
      - MAX_CONCURRENT_JOBS=100
      # Auto Trading Configuration
      - AUTO_TRADING_ENABLED=${AUTO_TRADING_ENABLED:-false}
      - MAX_POSITIONS=${MAX_POSITIONS:-5}
      - DAILY_TRADE_LIMIT=${DAILY_TRADE_LIMIT:-10}
      - RISK_PER_TRADE=${RISK_PER_TRADE:-0.01}
      - MIN_CONFIDENCE=${MIN_CONFIDENCE:-0.6}
      - MODEL_PATH=./models/confidence_model.pkl
    volumes:
      - ../app:/app/app
      - ./logs:/app/logs
      - ../models:/app/models
      - ../.env:/app/.env
    depends_on:
      - redis
      - timescaledb
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - crypto-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Auto Trading Service (can be run separately)
  auto-trader:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: crypto-auto-trader
    restart: unless-stopped
    environment:
      - BYBIT_API_KEY=${BYBIT_API_KEY}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET}
      - BYBIT_TESTNET=${BYBIT_TESTNET:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_IDS=${TELEGRAM_CHAT_IDS}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgres@timescaledb:5432/crypto_signals
      - AUTO_TRADING_ENABLED=true
      - MAX_POSITIONS=${MAX_POSITIONS:-5}
      - DAILY_TRADE_LIMIT=${DAILY_TRADE_LIMIT:-10}
      - RISK_PER_TRADE=${RISK_PER_TRADE:-0.01}
      - MIN_CONFIDENCE=${MIN_CONFIDENCE:-0.6}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../app:/app/app
      - ./logs:/app/logs
      - ../models:/app/models
      - ../.env:/app/.env
    depends_on:
      - redis
      - timescaledb
      - app
    networks:
      - crypto-network
    command: ["python", "/app/test_trading_connection.py"]
    profiles:
      - auto-trading

  redis:
    image: redis:7-alpine
    container_name: crypto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - crypto-network

  timescaledb:
    image: timescale/timescaledb:2.13.0-pg15
    container_name: crypto-timescaledb
    restart: unless-stopped
    environment:
      - POSTGRES_DB=crypto_signals
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5434:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    networks:
      - crypto-network

  prometheus:
    image: prom/prometheus:latest
    container_name: crypto-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - crypto-network

  grafana:
    image: grafana/grafana:latest
    container_name: crypto-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - crypto-network

  loki:
    image: grafana/loki:2.9.0
    container_name: crypto-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - crypto-network

volumes:
  redis-data:
  timescale-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  crypto-network:
    driver: bridge 